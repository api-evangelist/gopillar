aid: gopillar
name: GoPillar
description: >-
  GoPillar (operated by CoContest Italy Srl, Rome, Italy) is a crowdsourced
  architectural and interior design marketplace where homeowners, businesses,
  and small construction firms launch online design contests and receive dozens
  of proposals from a global community of 70,000+ registered architects and
  designers. Clients set a project timeline, brief the community, message
  participating designers, and select the winning concept, with follow-on
  one-to-one and offline executive-project services. GoPillar also runs GoPillar
  Academy, an e-learning platform offering professional BIM, 3D, and design
  courses plus custom corporate training for architecture and construction
  firms. GoPillar is a consumer/SMB web platform and does not publish a public
  developer API, SDKs, or developer documentation; this profile captures its
  public web identity and domain security posture for the API Evangelist
  network.
